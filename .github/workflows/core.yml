name: Android production gate

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests, lint, debug APK, and release AAB
        run: >-
          ./gradlew
          :core:test
          :app:testDebugUnitTest
          :app:lintDebug
          :app:assembleDebug
          :app:bundleRelease
          --no-daemon
          --stacktrace
          --console=plain

      - name: Verify 16 KB native-library compatibility
        run: ./scripts/verify-16kb.sh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload test and lint reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-verification-reports
          path: |
            core/build/reports/
            app/build/reports/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload keyless test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-keyless-builds
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

  ui-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch app and run Compose smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon --stacktrace --console=plain

  distribute:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [verify, ui-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - name: Check Firebase configuration
        id: guard
        run: |
          if [ -n "$FIREBASE_APP_ID" ] && [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Firebase secrets not set — skipping distribution."
          fi
      - uses: actions/checkout@v5
        if: steps.guard.outputs.configured == 'true'
      - uses: actions/setup-java@v5
        if: steps.guard.outputs.configured == 'true'
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/wrapper-validation@v4
        if: steps.guard.outputs.configured == 'true'
      - uses: gradle/actions/setup-gradle@v4
        if: steps.guard.outputs.configured == 'true'
      - name: Build protected tester APK
        if: steps.guard.outputs.configured == 'true'
        env:
          ORS_API_KEY: ${{ secrets.ORS_API_KEY }}
          OCM_API_KEY: ${{ secrets.OCM_API_KEY }}
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain
      - name: Write service account
        if: steps.guard.outputs.configured == 'true'
        run: printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/service-account.json"
      - name: Distribute to testers
        if: steps.guard.outputs.configured == 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/service-account.json
        run: |
          npm install --global firebase-tools
          firebase appdistribution:distribute app/build/outputs/apk/debug/app-debug.apk \
            --app "$FIREBASE_APP_ID" \
            --groups testers \
            --release-notes "Automated build from $GITHUB_SHA"
